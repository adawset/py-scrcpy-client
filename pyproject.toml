[tool.poetry]
name = "scrcpy-client"
version = "0.5.0"
description = "A client of scrcpy"
authors = ["lengyue <lengyue@lengyue.me>"]
readme = "README.md"
repository = "https://github.com/leng-yue/py-scrcpy-client"
license = "MIT"
packages = [
    { include = "scrcpy" },
    { include = "scrcpy_ui" },
]

[tool.poetry.scripts]
py-scrcpy = "scrcpy_ui:main"

[tool.poetry.dependencies]
# Should match the python versions in .github/workflows/ci.yml and publish.yml
python = ">=3.9"
av = "^17"
numpy = "^2"
adbutils = "^2"

# Optional dependencies for ui
PySide6 = { version = "^6.11.0", optional = true }

[tool.poetry.extras]
ui = ["PySide6"]

[tool.poetry.group.dev.dependencies]
flake8 = "^7"
isort = "^6.0.0"
black = "^26.3.1"
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
Sphinx = "^9.1.0"
myst-parser = "^5.0.0"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
